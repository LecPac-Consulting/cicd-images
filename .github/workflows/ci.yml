name: Build Docker images

on:
  push:
    branches:
      - stable
      - dev
  workflow_dispatch:
  schedule:
    - cron: '12 3 * * 3'

jobs:
  build-base:
    uses: ./.github/workflows/build-image.yml
    with:
      image: base

  build-full:
    needs: build-base
    uses: ./.github/workflows/build-image.yml
    with:
      image: full
